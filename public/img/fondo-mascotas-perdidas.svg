<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <!-- Huellita -->
    <g id="huella">
      <path d="M0 5 C-9 6 -12 12.5 -8 18 C-4.6 22 4.6 22 8 18 C12 12.5 9 6 0 5 Z"/>
      <ellipse cx="-12" cy="-5" rx="4.6" ry="6" transform="rotate(-14 -12 -5)"/>
      <ellipse cx="-4" cy="-10" rx="4.4" ry="5.8"/>
      <ellipse cx="4" cy="-10" rx="4.4" ry="5.8"/>
      <ellipse cx="12" cy="-5" rx="4.6" ry="6" transform="rotate(14 12 -5)"/>
    </g>

    <!-- Huesito -->
    <g id="hueso">
      <rect x="-25" y="-5.5" width="50" height="11" rx="5.5"/>
      <circle cx="-21" cy="-5.5" r="6.5"/>
      <circle cx="-21" cy="5.5" r="6.5"/>
      <circle cx="21" cy="-5.5" r="6.5"/>
      <circle cx="21" cy="5.5" r="6.5"/>
    </g>

    <!-- Ovillo de lana -->
    <g id="ovillo">
      <circle cx="0" cy="0" r="15"/>
      <path d="M-13 2 C-10 -8 -1 -9 5 -5 C10 -2 9 4 3 6" fill="none" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-6 7 C-3 12 3 12 7 9" fill="none" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M12 14 C16 12.5 17.5 16.5 14.5 19 C12 21 9.5 18.5 11 16" fill="none" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Pescado -->
    <g id="pescado">
      <ellipse cx="0" cy="0" rx="17" ry="9.5"/>
      <polygon points="-18,-8.5 -29,0 -18,8.5"/>
      <polygon points="0,-9.5 3.5,-16 8,-9.5"/>
      <circle cx="9.5" cy="-3" r="2.4" fill="none" stroke-width="1.5"/>
      <circle cx="21" cy="-8.5" r="2.1"/>
      <circle cx="26" cy="-12.5" r="1.5"/>
    </g>
  </defs>

  <g fill="#ff7b00" stroke="#ff7b00">
    <g transform="translate(72 78) rotate(12)"><use href="#huella"/></g>
    <g transform="translate(288 62) rotate(-16)"><use href="#hueso"/></g>
    <g transform="translate(54 288) rotate(-7)"><use href="#ovillo"/></g>
    <g transform="translate(306 296) rotate(11)"><use href="#pescado"/></g>
    <g transform="translate(180 52) rotate(24) scale(0.7)"><use href="#pescado"/></g>
    <g transform="translate(196 196) rotate(-30) scale(0.6)"><use href="#huella"/></g>
    <g transform="translate(132 238) rotate(18) scale(0.72)"><use href="#hueso"/></g>
  </g>
